version: 1
project:
  name: RoboCup Ball Demo
  skill: robocup
  skill_version: "1"
  language: zh-CN
dataset:
  root: images
  include:
    - "**/*.jpg"
    - "**/*.jpeg"
    - "**/*.png"
  recursive: true
runtime:
  max_parallel_images: 2
  max_model_turns_per_task: 4
  max_tool_calls_per_task: 6
  max_recovery_turns_per_task: 1
  task_timeout_seconds: 300
  provider_request_timeout_seconds: 120
  max_retries: 3
  auto_resume: true
tasks:
  - id: objects
    kind: bounding_box
    labels: [ball]
    required: true
    multi_label: true
    validators: [ball_hard_negative]
review:
  auto_accept_confidence: 0.92
  force_review_below: 0.72
  force_review_on_warning_codes:
    - possible_white_shoe
    - possible_white_sock
    - possible_penalty_mark
    - possible_field_line_intersection
    - inaccurate_ball_bbox
export:
  formats: [native, coco, yolo, labelme]
