version: 1
project:
  name: YOLO Crop Classification Demo
  language: en
dataset:
  root: images
runtime:
  max_parallel_images: 4
tasks:
  - id: objects
    kind: bounding_box
    labels: [person]
    required: true
    multi_label: true
    attributes:
      pose:
        type: enum
        required: true
        values: [upright, fallen]
review:
  auto_accept_confidence: 0.9
  force_review_below: 0.5
export:
  formats: [native, coco, yolo]
