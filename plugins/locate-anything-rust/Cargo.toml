[package]
name = "annotagent-plugin-locate-anything-rust"
description = "Unsupported-state Rust protocol contract for NVIDIA LocateAnything"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "annotagent_plugin_locate_anything_rust"
path = "src/lib.rs"

[[bin]]
name = "annotagent-plugin-locate-anything-rust"
path = "src/main.rs"

