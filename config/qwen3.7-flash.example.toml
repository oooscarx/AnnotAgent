# OpenAI-compatible DashScope example. Keep the key in ANNOTAGENT_API_KEY.
default_provider = "openai_compatible"

[provider]
endpoint = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "ANNOTAGENT_API_KEY"
model = "qwen3.7-flash-2026-07-15"
protocol = "chat_completions"
request_timeout_seconds = 120
max_output_tokens = 2048
temperature = 0.1
reasoning_mode = "medium"
supports_tool_calls = true
supports_json_schema = true
custom_headers = {}
extra_request_fields = {}
max_retries = 2

[pricing]
currency = "USD"
# Update these exact decimal prices to match the active DashScope billing tier.
input_per_million_tokens = "0"
output_per_million_tokens = "0"
per_image = "0"
per_request = "0"
per_credit = "0"

[budget]
max_input_tokens = 200000
max_output_tokens = 50000
max_total_tokens = 250000
max_cost = "2.0"
max_requests = 100
max_images = 10
# Optional batch-wide wall-clock deadline. Uncomment to enable.
# max_wall_clock_seconds = 3600
