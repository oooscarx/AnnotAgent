[workspace]
members = [
    "apps/annotagent",
    "crates/annotagent-application",
    "crates/annotagent-core",
    "crates/annotagent-export",
    "crates/annotagent-image-tools",
    "crates/annotagent-model-runtime-common",
    "crates/annotagent-model-runtime-onnx",
    "crates/annotagent-provider",
    "crates/annotagent-plugin-api",
    "crates/annotagent-plugin-host",
    "crates/annotagent-plugin-registry",
    "crates/annotagent-plugin-sdk",
    "crates/annotagent-runtime",
    "crates/annotagent-server",
    "crates/annotagent-skill-classification",
    "crates/annotagent-skill-open-vocabulary",
    "crates/annotagent-skill-object-detection",
    "crates/annotagent-skill-robocup",
    "crates/annotagent-skill-segmentation",
    "crates/annotagent-skill-vlm-detection",
    "crates/annotagent-skill-yolo",
    "crates/annotagent-storage",
    "crates/annotagent-e2e-fixture",
    "plugins/dummy-detector",
  "plugins/pidnet-onnx",
  "plugins/rfdetr-onnx",
  "plugins/locate-anything-rust",
  "plugins/sam-onnx",
    "plugins/yolo-onnx",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }
keyring = "4.1"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = { version = "1", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled", "chrono", "uuid"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
walkdir = "2"
webbrowser = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
future_not_send = "allow"
unnecessary_literal_bound = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# AnnotAgent's workspace tests link several large binaries. Incremental debug
# artifacts grow much faster than they help this project, especially after
# repeated all-feature CI runs, so keep local build output bounded.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
