[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "annotagent-vision-worker"
version = "0.1.0"
description = "Versioned SDK for AnnotAgent expert vision workers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.111,<1",
  "pydantic>=2.7,<3",
  "pillow>=10,<13",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
annotagent-vision-worker = "annotagent_vision_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["annotagent_vision_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
